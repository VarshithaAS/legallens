<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LegalLens</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f7fb;
        }

        .register-box {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            text-align: center;
        }

        .logo {
            width: 90px;
            margin-bottom: 10px;
        }

        h1 {
            color: #14213d;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .input-box {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5d9e2;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #5b4bdb;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #3f51b5, #7b4bd4);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-link {
            margin-top: 20px;
            color: #666;
        }

        .login-link a {
            color: #5146c7;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="register-box">

    <img src="{{ url_for('static', filename='images/logo.png') }}"
         alt="LegalLens Logo"
         class="logo">

    <h1>Create Account</h1>

    <p class="subtitle">Join LegalLens today</p>

    <form action="#" method="POST">

        <div class="input-box">
            <label>Full Name</label>
            <input type="text"
                   name="fullname"
                   placeholder="Enter your full name"
                   required>
        </div>

        <div class="input-box">
            <label>Username</label>
            <input type="text"
                   name="username"
                   placeholder="Choose a username"
                   required>
        </div>

        <div class="input-box">
            <label>Email</label>
            <input type="email"
                   name="email"
                   placeholder="Enter your email"
                   required>
        </div>

        <div class="input-box">
            <label>Password</label>
            <input type="password"
                   name="password"
                   placeholder="Create a password"
                   required>
        </div>

        <div class="input-box">
            <label>Confirm Password</label>
            <input type="password"
                   name="confirm_password"
                   placeholder="Confirm your password"
                   required>
        </div>

        <button type="submit" class="register-btn">
            Register
        </button>

    </form>

    <p class="login-link">
        Already have an account?
        <a href="{{ url_for('login') }}">Login</a>
    </p>

</div>

</body>
</html>
